[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-tool-harness"
version = "0.1.0"
description = "Small contract harness for making internal tools discoverable, runnable, inspectable, and skill-exportable by AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jarl", email = "okbexx@gmail.com" }]
keywords = ["ai-agent", "tools", "cli", "harness", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["typer>=0.12.0", "rich>=13.7.0", "pydantic>=2.7.0"]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "ruff>=0.5.0", "build>=1.2.0"]

[project.scripts]
agent-tool-harness = "agent_tool_harness.cli:app"
ath = "agent_tool_harness.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_tool_harness"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
